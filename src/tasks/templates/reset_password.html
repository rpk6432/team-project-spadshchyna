<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:#F5F0E8;font-family:Georgia,'Times New Roman',serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F5F0E8;padding:40px 0">
<tr><td align="center">
<table width="560" cellpadding="0" cellspacing="0" style="background:#FFFFFF;border:1px solid #E8DFD0;border-radius:8px">

  <tr><td style="padding:32px 40px 24px;border-bottom:1px solid #E8DFD0">
    <img src="{{ logo_url }}" alt="Spadshchyna" width="400" style="display:block">

  <tr><td style="padding:32px 40px">

    <p style="margin:0 0 16px;font-size:16px;line-height:1.6;color:#4A3728">
      Hi {{ first_name }}, use the code below to reset your password:

    <p style="margin:0 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:36px;font-weight:bold;letter-spacing:8px;text-align:center;color:#6B5744">
      {{ code }}

    <p style="margin:0;font-size:14px;line-height:1.6;color:#A89880">
      This code is valid for 10 minutes. If you didn't request a password reset, ignore this email.
    </p>
  </td></tr>

  <tr><td style="padding:24px 40px;border-top:1px solid #E8DFD0;text-align:center">
    <p style="margin:0;font-size:13px;color:#A89880">Ethno-Homestead Archive of Ukraine</p>
  </td></tr>

</table>
</td></tr>
</table>
